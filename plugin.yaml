name: ca_assembler
version: 5.5.0
description: >
  ContextAssembler v5.1 — Hermes 插件，增量 L0/L1/L2 分层摘要 + plan-based 消息组装 +
  工具轮结构化摘要（10 个结构化 handler）+ L‑stage 异步补全 + 全指纹去重（原位标记）
  + replace 模式注入重构（bypass_turns 统一、_format_tool_group_assembly、独立工具行消除）。
pip_dependencies:
  - numpy
  - urllib3
  - sentence-transformers
  - pyyaml
requires_env: []
hooks:
  - on_session_start
  - on_session_end
  - on_session_reset
  - pre_llm_call
  - post_llm_call
config_schema:
  embed_backend:
    type: string
    default: "ollama"
    enum: ["ollama", "sentence-transformers", "fallback"]
  embed_model:
    type: string
    default: "qwen3-embedding:0.6b"
  embed_endpoint:
    type: string
    default: "http://localhost:11439"
  llm_model:
    type: string
    default: "qwen3-4b-instruct"
  llm_endpoint:
    type: string
    default: "http://localhost:11440"
  context_length:
    type: integer
    default: 50000
  tool_max_upgrade_k:
    type: integer
    default: 3
  embed_timeout:
    type: integer
    default: 10
  llm_timeout:
    type: integer
    default: 120
  debug:
    type: boolean
    default: false
