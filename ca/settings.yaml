# CA 插件运行时默认配置
# 本文件仅以下 4 个键生效（被 ca/config.py `_YAML_DEFAULTS` 读取为 Config 类默认值）：
#   protect_tail_tokens / topic_jaccard_entry / topic_jaccard_chain / topic_peak_token
# 其余配置（embed_*/llm_*/context_length/tool_*/db_*/debug/l1_temperature/l1_max_tokens 等）
# 经环境变量 CA_* 或 config.py 硬编码默认，本文件不承载（避免死配置误导）。
# 优先级：环境变量 > settings.yaml > 代码硬编码

# ── 上下文预算 ──
protect_tail_tokens: 20000       # 话题块 Token 保护安全阀（语义由 TOPIC_PEAK_TOKEN 承接，死配置保留兼容）

# ── 话题分割 ──
topic_jaccard_entry: 0.04
topic_jaccard_chain: 0.08
topic_peak_token: 20000      # 水位满压时的 Token 值（最后防线）
