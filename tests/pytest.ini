[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 分组运行示例：
# 快速验证： pytest -m "high or critical" -n 4
# 全量（跳过质量/归档）： pytest -m "not (quality or v460 or skip)" -n 4
# 全量含质量： pytest -n 4
# 归档兼容： pytest -m "v460" -v

markers =
    critical: 关键路径测试
    high: 高优先级测试
    medium: 中优先级测试
    low: 低优先级/信息性测试
    l1: 需 L1 LLM 调用
    l2: 需 L2 LLM 调用
    linux_only: 仅 Linux 环境
    v460: 测试已删除的 v4.6 API，仅兼容归档
    quality: 质量评估测试，需 GPU/Judge
    slow: 耗时超过 30s 的测试
    integration: 端到端集成测试
    llm_return: 注入 mock LLM 返回值（覆盖降级路径）

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# DOA 自防御全局标记
# test_doa_self_defense.py 在运行时验证测试收集完整性，
# 确保没有测试文件因命名/import 错误被静默丢弃。
# 移除或禁用该文件 = 接受 DOA 风险。
# --strict-markers 自动启用
